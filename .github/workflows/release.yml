name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: release-tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_VERSION"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version tag: $tag" >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              git checkout --detach "$tag"
            else
              git tag -f "$tag" "$GITHUB_SHA"
              git push --force origin "$tag"
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build Linux x86-64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/notion-getpage_linux_amd64 ./cmd/notion-getpage
          sh scripts/generate-notices.sh dist/THIRD_PARTY_NOTICES.txt
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum notion-getpage_linux_amd64 LICENSE THIRD_PARTY_NOTICES.txt > checksums.txt
      - name: Test installer
        run: sh scripts/test-install.sh dist/notion-getpage_linux_amd64
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/notion-getpage_linux_amd64 dist/checksums.txt dist/LICENSE dist/THIRD_PARTY_NOTICES.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/notion-getpage_linux_amd64 dist/checksums.txt dist/LICENSE dist/THIRD_PARTY_NOTICES.txt --verify-tag --generate-notes
          fi
